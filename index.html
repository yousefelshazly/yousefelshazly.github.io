<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yousef ElShazly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0A0C0F;
      --surface:   #111418;
      --accent:    #4A9EFF;
      --accent-dim:#1A3A5C;
      --text:      #E8ECF0;
      --muted:     #5A6472;
      --line:      #1E2530;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      padding: clamp(2rem, 8vw, 6rem);
      padding-top: calc(clamp(2rem, 8vw, 6rem) + env(safe-area-inset-top, 0px));
      padding-bottom: calc(clamp(2rem, 8vw, 6rem) + env(safe-area-inset-bottom, 0px));
    }

    /* Subtle grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
    }

    /* Status badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.04em;
      margin-bottom: 2.5rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Name — the main visual moment */
    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 300;
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    h1 span {
      color: var(--accent);
    }

    /* Role line */
    .role {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      color: var(--muted);
      line-height: 1.6;
      max-width: 46ch;
      margin-bottom: 3rem;
    }

    /* Divider */
    .divider {
      width: 48px;
      height: 1px;
      background: var(--accent-dim);
      margin-bottom: 3rem;
    }

    /* Coming soon block */
    .coming {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--muted);
      line-height: 2;
      letter-spacing: 0.02em;
    }

    .coming-item {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .coming-item::before {
      content: '//';
      color: var(--accent-dim);
      flex-shrink: 0;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: 4rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      body {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="status">
      <span class="status-dot"></span>
      building in public
    </div>

    <h1>Yousef<br /><span>ElShazly</span></h1>

    <p class="role">
      Machine learning &amp; data — turning messy datasets into decisions that hold up.
      Portfolio coming soon.
    </p>

    <div class="divider"></div>

    <div class="coming" aria-label="Sections coming soon">
      <div class="coming-item">projects &amp; case studies</div>
      <div class="coming-item">tools &amp; stack</div>
      <div class="coming-item">contact</div>
    </div>

  </div>

  <footer>yousef-elshazly · week 04 · empty but live</footer>

</body>
</html>
